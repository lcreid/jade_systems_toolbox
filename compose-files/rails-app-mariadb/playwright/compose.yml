services:
  web:
    image: lenchoreyes/jade:rails-app-${RUBY_VERSION:-4.0}-mariadb-${DISTRO_VERSION:-trixie}
    tmpfs:
      - /tmp
    stdin_open: true
    tty: true
    user: "dev:dev"
    volumes:
      - .:/home/dev/app
      - dev_home:/home/dev
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
      - NODE_ENV=development
      - BOOTSNAP_CACHE_DIR=/usr/local/bundle/_bootsnap
      - WEB_CONCURRENCY=1
    command: /bin/bash
    ports:
      - "3000"
    depends_on:
      - db

  db:
    image: mariadb:latest
    volumes:
      - mariadb:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "exit | mariadb -h 127.0.0.1 -P 3306 -u root -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s

# Playwright is picky about the image version and the gem version you're using.
# You probably have to change the image version.
  playwright: # this is our PLAYWRIGHT_HOST value
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    command: >
      /bin/sh -c "npx -y playwright@1.61.0 run-server --port 3000 --host 0.0.0.0 --path /ws"
    init: true
    restart: unless-stopped

# The volumes are storage that docker-compose manages and maintains across rebuilds
# of the images and containers. If, for example, you need to change the default
# mariadb user or password, you need to `docker volume rm <project_volume>`.
volumes:
  dev_home:
  mariadb:

