services:
  db:
    image: mysql:8.4
    volumes:
      - mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "exit | mysql -h 127.0.0.1 -P 3306 -u root -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s

volumes:
  mysql:
